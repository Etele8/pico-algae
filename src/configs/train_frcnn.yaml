seed: 42
val_frac: 0.0
epochs: 60
batch_size: 4
num_workers: 8
amp: true

classes_to_count: [1, 2, 3]

# anchor_sizes from the tuning sweep that produced the current served model
# (trial 15, best_train_model_summary.json). These beat [8,16,32,64,128] on
# count-MAE, so they're the retrain default.
space:
  anchor_sizes: [[12], [24], [48], [96], [192]]
  aspect_ratios: [[0.5, 1.0, 2.0],
                  [0.5, 1.0, 2.0],
                  [0.5, 1.0, 2.0],
                  [0.5, 1.0, 2.0],
                  [0.5, 1.0, 2.0]]

weight_decay: 1e-4
trainable_backbone_layers: 3
lr_backbone: 2e-5
lr_heads: 2e-4
detections_per_image: 300
box_nms_thresh: 0.5
score_thresh: 0.5
flip_p: 0.0
